<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Name – Architektur</title>
  <meta name="description" content="Ausgewählte Architekturprojekte von Studio Name.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Headline in der Mitte (wechselt beim Hover zum Projekttitel) -->
  <div class="center">
    <header class="hero">
      <h1>Räume,<br>die bleiben.</h1>
      <p>Studio Name · Architektur</p>
    </header>
    <div class="focus-title" id="focusTitle" aria-live="polite">
      <span class="num"></span>
      <h2></h2>
    </div>
  </div>

  <!-- Die fünf Projekte -->
  <main class="stage" id="stage">
    <figure class="tile" style="--i:0" data-depth="1.0" data-title="Wohnturm Mitte">
      <a href="#projekt-1">
        <img src="images/projekt-1.svg" alt="Projekt 1 – Wohnturm Mitte">
      </a>
    </figure>

    <figure class="tile" style="--i:1" data-depth="1.4" data-title="Haus am See">
      <a href="#projekt-2">
        <img src="images/projekt-2.svg" alt="Projekt 2 – Haus am See">
      </a>
    </figure>

    <figure class="tile" style="--i:2" data-depth="0.8" data-title="Kulturzentrum Süd">
      <a href="#projekt-3">
        <img src="images/projekt-3.svg" alt="Projekt 3 – Kulturzentrum Süd">
      </a>
    </figure>

    <figure class="tile" style="--i:3" data-depth="1.6" data-title="Werkhalle Nord">
      <a href="#projekt-4">
        <img src="images/projekt-4.svg" alt="Projekt 4 – Werkhalle Nord">
      </a>
    </figure>

    <figure class="tile" style="--i:4" data-depth="1.2" data-title="Atelier im Wald">
      <a href="#projekt-5">
        <img src="images/projekt-5.svg" alt="Projekt 5 – Atelier im Wald">
      </a>
    </figure>
  </main>

  <!-- Kontakt unten rechts -->
  <aside class="contact">
    <small>Kontakt</small>
    <a href="mailto:hallo@studioname.de">hallo@studioname.de</a><br>
    <a href="tel:+491234567890">+49 123 456 7890</a>
  </aside>

  <script src="script.js"></script>
</body>
</html>
