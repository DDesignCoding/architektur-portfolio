<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Name – Architektur</title>
<style>
  :root {
    --bg: #0d0d0d;
    --fg: #f2f0eb;
    --muted: #8a8780;
    --ease: cubic-bezier(.22, .61, .36, 1);
    --tile-w: clamp(110px, 12.5vw, 220px);   /* Breite aller Bilder – alle gleich groß */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  /* ---------- Headline (groß, zentriert) ---------- */
  .center {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    pointer-events: none;
    text-align: center;
    padding: 0 6vw;
  }
  .center > * {
    grid-area: 1 / 1;
    transition: opacity .6s var(--ease), transform .7s var(--ease);
  }

  .hero h1 {
    font-weight: 300;
    font-size: clamp(2.6rem, 8.5vw, 9rem);
    letter-spacing: -0.04em;
    line-height: .95;
  }
  .hero p {
    margin-top: 1.6rem;
    color: var(--muted);
    font-size: .8rem;
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  /* Projekt-Titel (erscheint beim Hover, ersetzt die Headline) */
  .focus-title {
    opacity: 0;
    transform: translateY(24px);
  }
  .focus-title .num {
    display: block;
    color: var(--muted);
    font-size: .8rem;
    letter-spacing: .22em;
    margin-bottom: 1.2rem;
  }
  .focus-title h2 {
    font-weight: 300;
    font-size: clamp(2.2rem, 6.5vw, 7rem);
    letter-spacing: -0.035em;
    line-height: 1;
  }

  body.has-focus .hero { opacity: 0; transform: translateY(-24px); }
  body.has-focus .focus-title { opacity: 1; transform: none; }

  /* ---------- Kontakt (unten rechts) ---------- */
  .contact {
    position: fixed;
    right: 2.5rem;
    bottom: 2.5rem;
    z-index: 30;
    text-align: right;
    font-size: .9rem;
    line-height: 1.6;
  }
  .contact a {
    color: var(--fg);
    text-decoration: none;
    background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
    transition: background-size .4s var(--ease);
  }
  .contact a:hover { background-size: 100% 1px; }
  .contact small {
    display: block;
    color: var(--muted);
    letter-spacing: .18em;
    text-transform: uppercase;
    font-size: .7rem;
    margin-bottom: .3rem;
  }

  /* ---------- Bühne mit Bildern ---------- */
  .stage { position: fixed; inset: 0; }

  .tile {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--tile-w);
    aspect-ratio: 4 / 5;                 /* identisches Format für alle */
    margin-left: calc(var(--tile-w) / -2);   /* x/y = Mittelpunkt des Bildes */
    margin-top: calc(var(--tile-w) * -0.625);
    will-change: transform;
    z-index: 1;
  }
  .tile:hover, .tile:focus-within { z-index: 10; }

  .tile a {
    display: block;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a1a;
    outline: none;
    transition:
      transform .7s var(--ease),
      opacity .6s var(--ease),
      box-shadow .7s var(--ease);
  }

  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(1) contrast(1.05) brightness(.8);
    transform: scale(1.08);
    transition: filter .7s var(--ease), transform 1.1s var(--ease);
  }

  /* Fokus-Zustand */
  .tile:hover a,
  .tile:focus-within a {
    transform: scale(1.12);
    box-shadow: 0 40px 80px rgba(0, 0, 0, .55);
  }
  .tile:hover img,
  .tile:focus-within img {
    filter: grayscale(0) contrast(1) brightness(1);
    transform: scale(1);
  }

  /* Die anderen Bilder treten zurück */
  .stage.has-focus .tile:not(.is-active) a { opacity: .2; }

  /* ---------- Positionen (Mittelpunkte) rund um die Headline ---------- */
  .tile:nth-child(1) { --x: 14vw; --y: 28vh; }
  .tile:nth-child(2) { --x: 50vw; --y: 15vh; }
  .tile:nth-child(3) { --x: 86vw; --y: 30vh; }
  .tile:nth-child(4) { --x: 24vw; --y: 80vh; }
  .tile:nth-child(5) { --x: 74vw; --y: 78vh; }

  /* ---------- Mobile / Touch: Liste ohne Parallax ---------- */
  @media (max-width: 760px) {
    html, body { overflow: auto; }
    .center {
      position: static;
      min-height: 55vh;
      padding: 6rem 1.5rem 2rem;
    }
    .stage {
      position: static;
      padding: 0 1.5rem 7rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .tile {
      position: relative;
      left: auto; top: auto;
      width: 100%;
      margin: 0;
      transform: none !important;
    }
    .contact { right: 1.5rem; bottom: 1.5rem; background: var(--bg); padding: .6rem 0 0 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

  <!-- Headline in der Mitte (wechselt beim Hover zum Projekttitel) -->
  <div class="center">
    <header class="hero">
      <h1>Räume,<br>die bleiben.</h1>
      <p>Studio Name · Architektur</p>
    </header>
    <div class="focus-title" id="focusTitle" aria-live="polite">
      <span class="num"></span>
      <h2></h2>
    </div>
  </div>

  <main class="stage" id="stage">
    <figure class="tile" data-depth="22" data-title="Wohnturm Mitte">
      <a href="#projekt-1" tabindex="0">
        <img src="images/projekt-1.svg" alt="Projekt 1 – Wohnturm Mitte">
      </a>
    </figure>

    <figure class="tile" data-depth="38" data-title="Haus am See">
      <a href="#projekt-2" tabindex="0">
        <img src="images/projekt-2.svg" alt="Projekt 2 – Haus am See">
      </a>
    </figure>

    <figure class="tile" data-depth="16" data-title="Kulturzentrum Süd">
      <a href="#projekt-3" tabindex="0">
        <img src="images/projekt-3.svg" alt="Projekt 3 – Kulturzentrum Süd">
      </a>
    </figure>

    <figure class="tile" data-depth="44" data-title="Werkhalle Nord">
      <a href="#projekt-4" tabindex="0">
        <img src="images/projekt-4.svg" alt="Projekt 4 – Werkhalle Nord">
      </a>
    </figure>

    <figure class="tile" data-depth="28" data-title="Atelier im Wald">
      <a href="#projekt-5" tabindex="0">
        <img src="images/projekt-5.svg" alt="Projekt 5 – Atelier im Wald">
      </a>
    </figure>
  </main>

  <aside class="contact">
    <small>Kontakt</small>
    <a href="mailto:hallo@studioname.de">hallo@studioname.de</a><br>
    <a href="tel:+491234567890">+49 123 456 7890</a>
  </aside>

<script>
(() => {
  const stage = document.getElementById('stage');
  const tiles = [...stage.querySelectorAll('.tile')];
  const focusBox = document.getElementById('focusTitle');
  const focusNum = focusBox.querySelector('.num');
  const focusH2 = focusBox.querySelector('h2');

  /* ---------- Parallax ---------- */
  const isTouch = window.matchMedia('(hover: none), (max-width: 760px)').matches;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!isTouch && !reduced) {
    let targetX = 0, targetY = 0, curX = 0, curY = 0;

    window.addEventListener('mousemove', e => {
      targetX = (e.clientX / window.innerWidth  - 0.5) * 2;   // -1 … 1
      targetY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    const loop = () => {
      curX += (targetX - curX) * 0.06;   // sanftes Nachziehen
      curY += (targetY - curY) * 0.06;

      tiles.forEach(tile => {
        const depth = parseFloat(tile.dataset.depth) || 20;
        tile.style.transform =
          `translate3d(${(-curX * depth).toFixed(2)}px, ${(-curY * depth).toFixed(2)}px, 0)`;
      });
      requestAnimationFrame(loop);
    };
    loop();
  }

  /* ---------- Fokus / Hover ---------- */
  const activate = tile => {
    const i = tiles.indexOf(tile) + 1;
    tiles.forEach(t => t.classList.toggle('is-active', t === tile));
    stage.classList.add('has-focus');
    document.body.classList.add('has-focus');
    focusNum.textContent = String(i).padStart(2, '0') + ' / ' + String(tiles.length).padStart(2, '0');
    focusH2.textContent = tile.dataset.title;
  };

  const deactivate = () => {
    tiles.forEach(t => t.classList.remove('is-active'));
    stage.classList.remove('has-focus');
    document.body.classList.remove('has-focus');
  };

  tiles.forEach(tile => {
    tile.addEventListener('mouseenter', () => activate(tile));
    tile.addEventListener('mouseleave', deactivate);
    tile.addEventListener('focusin',  () => activate(tile));
    tile.addEventListener('focusout', deactivate);
  });
})();
</script>
</body>
</html>
